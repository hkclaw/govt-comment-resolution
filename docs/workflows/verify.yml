name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer poppler-utils fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install pypdf Pillow reportlab

      - name: Run every check
        run: ./verify.sh

      - name: Run one full review round against the sample document
        run: ./examples/run_example.sh
